name: CI

# US-AD50 AC2 wants CI to fail the moment a hardcoded UI string appears. This is
# the first workflow in the repo — the check existed as a rule in the PRD with no
# runner behind it.
#
# Scope: the two jobs here are the ones a push can afford to block on. The Go
# suite is NOT run here because it needs Postgres and takes ~8 minutes; the
# repo's own gate (tools/gate-overnight.cmd) already covers gofmt + build + tsc +
# vitest + prettier locally, and .hermes.md documents go test as a separate,
# manual step. Wiring the whole suite into CI is a bigger decision than this
# story, and claiming CI runs it while it does not would be worse than not having
# the job.
#
# AGENTDECK_TEST_DATABASE_URL is deliberately absent: the Go suites skip
# themselves without it (internal/auth/postgres_test.go:35), so the Go job here
# runs the unit tests and is honest about what it did not run.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt wants these files reformatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  web:
    name: Web (i18n, types, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # US-AD50 AC1/AC2. Fails non-zero as soon as hardcoded UI text is added;
      # the baseline in frontend/scripts/i18n-baseline.json freezes what already
      # exists so this job is meaningful today instead of red.
      - name: hardcoded UI text
        run: npm run check:i18n
      - name: types
        run: npx tsc -b
      - name: unit tests
        run: npm test
